<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="DatabricksMCP logo concept">
  <defs>
    <linearGradient id="edge" x1="70" y1="70" x2="440" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#56D6FF"/>
      <stop offset="0.52" stop-color="#7A7CFF"/>
      <stop offset="1" stop-color="#FF6464"/>
    </linearGradient>
    <linearGradient id="layer" x1="160" y1="160" x2="360" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#DDE7F3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1220" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Protocol perimeter -->
  <path d="M256 42 420 137 420 326 256 420 92 326 92 137Z"
        fill="none" stroke="url(#edge)" stroke-width="15" stroke-linejoin="round"/>
  <circle cx="256" cy="42" r="18" fill="#0B1220" stroke="#56D6FF" stroke-width="8"/>
  <circle cx="420" cy="137" r="18" fill="#0B1220" stroke="#7A7CFF" stroke-width="8"/>
  <circle cx="420" cy="326" r="18" fill="#0B1220" stroke="#FF6464" stroke-width="8"/>
  <circle cx="256" cy="420" r="18" fill="#0B1220" stroke="#FF6464" stroke-width="8"/>
  <circle cx="92" cy="326" r="18" fill="#0B1220" stroke="#7A7CFF" stroke-width="8"/>
  <circle cx="92" cy="137" r="18" fill="#0B1220" stroke="#56D6FF" stroke-width="8"/>

  <!-- Inner control-plane shield -->
  <path d="M256 106 356 145 356 245c0 75-43 125-100 160-57-35-100-85-100-160V145Z"
        fill="#0B1220" filter="url(#shadow)"/>

  <!-- Layered data planes -->
  <path d="m256 159 73 37-73 37-73-37Z" fill="url(#layer)"/>
  <path d="m183 222 73 37 73-37v25l-73 37-73-37Z" fill="#C9D6E6"/>
  <path d="m183 273 73 37 73-37v25l-73 37-73-37Z" fill="#AFC1D6"/>

  <!-- MCP / agent link -->
  <circle cx="256" cy="363" r="12" fill="#56D6FF"/>
  <circle cx="212" cy="344" r="8" fill="#7A7CFF"/>
  <circle cx="300" cy="344" r="8" fill="#FF6464"/>
  <path d="M219 347 246 359M293 347 266 359" stroke="#F7FAFC" stroke-width="7" stroke-linecap="round"/>
</svg>