name: Bug report
description: Report a reproducible problem without including credentials or customer data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include tokens, secrets, workspace URLs, or customer data.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal sanitized reproduction.
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [stdio, streamable-http, unknown]
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, workspace identifiers, and customer data.
          required: true
